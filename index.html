<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#12141a">
  <title>Mines</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app is-idle" id="app">
    <div class="fx-dom" id="fxDom" aria-hidden="true"></div>

    <header class="topnav">
      <div class="topnav-body">
        <span class="topnav-gloss"></span>
        <button class="nav-btn" type="button" aria-label="Меню">
          <span class="grid-ico"></span>
        </button>
        <img class="bomb-logo" src="assets/bomb-logo.png" alt="">
        <button class="nav-btn" type="button" id="musicBtn" aria-label="Музыка">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 16.5V6l10-2v10.5a3.5 3.5 0 1 1-2-3.16V6.7L12 8.3v8.2a3.5 3.5 0 1 1-2 0z"/></svg>
        </button>
      </div>
    </header>

    <div class="dots" id="dots">
      <span></span><span></span><span></span>
    </div>

    <div class="field">
      <section class="vault" id="vault">
        <div class="vault-body">
          <div class="vault-screen">
            <div class="win-copy" id="winCopy">YOU WIN</div>
          </div>
        </div>
      </section>

      <main class="viewport" id="viewport">
        <div class="board" id="board">
          <div class="row" data-row="0">
            <div class="cell" role="button" tabindex="0" data-i="0" aria-label="Клетка 1"></div>
            <div class="cell" role="button" tabindex="0" data-i="1" aria-label="Клетка 2"></div>
          </div>
          <div class="row" data-row="1">
            <div class="cell" role="button" tabindex="0" data-i="2" aria-label="Клетка 3"></div>
            <div class="cell" role="button" tabindex="0" data-i="3" aria-label="Клетка 4"></div>
          </div>
          <div class="row" data-row="2">
            <div class="cell" role="button" tabindex="0" data-i="4" aria-label="Клетка 5"></div>
            <div class="cell" role="button" tabindex="0" data-i="5" aria-label="Клетка 6"></div>
          </div>
        </div>
      </main>
    </div>

    <p class="prompt" id="prompt">Выбери сумму ставки и нажми <span class="prompt-play">▶</span></p>

    <div class="hash" id="hash">
      <div class="hash-left">
        <span class="hash-mark"></span>
        <span class="hash-title">Hash</span>
        <span class="hash-x">x</span>
      </div>
      <div class="hash-steps" id="hashSteps"></div>
      <div class="hash-glow"></div>
    </div>

    <section class="controls" id="controls">
      <div class="idle-bar" id="idleBar">
        <div class="size-chip">2x3</div>
        <div class="stake">
          <button class="step" type="button" id="betMinus" aria-label="Меньше">−</button>
          <div class="stake-mid">
            <div class="stake-val"><span id="betLabel">5000</span> RUB</div>
            <div class="stake-sub">баланс: <span id="idleBalance">291020.11</span> RUB</div>
          </div>
          <button class="step" type="button" id="betPlus" aria-label="Больше">+</button>
        </div>
        <button class="play-btn" type="button" id="playBtn" aria-label="Старт">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l12-6.5L8 5.5z"/></svg>
        </button>
      </div>

      <div class="play-bar" id="playBar" hidden>
        <button class="side-btn" type="button" aria-label="Кубик">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 4 L27 10.5 V21.5 L16 28 L5 21.5 V10.5 Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M16 4 V28 M5 10.5 L16 17 L27 10.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <div class="total-win" id="totalWinBox">
          <div class="total-val" id="totalWin">0 RUB</div>
          <div class="total-sub">Общий выигрыш</div>
        </div>
        <button class="side-btn cash" type="button" id="cashBtn" aria-label="Забрать">$</button>
      </div>
    </section>

    <button class="again" type="button" id="againBtn" hidden>Ещё раз</button>

    <footer class="footer">
      <button class="back" type="button" id="backBtn">‹ Назад</button>
      <div class="balance" id="footerBalance">291 020,11 ₽</div>
      <button class="deposit" type="button" id="depositBtn">Пополнить</button>
    </footer>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
